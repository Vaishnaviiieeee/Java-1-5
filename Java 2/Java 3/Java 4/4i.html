<!DOCTYPE html>
<html lang="en">
<head>
    <title>Product</title>
    <style>
        .product-name {
            font-family: Georgia, serif;
            font-size: 18px;
        }
        .product-price {
            font-family: Georgia, serif;
            font-size: 16px;
            margin-bottom: 20px;
        }
        .add-to-cart-button {
            background-color: yellow;
            border: 1px solid black;
            padding: 4px 8px;
            cursor: pointer;
        }
        .buy-now-button {
            background-color: orange;
            border: 1px solid black;
            padding: 4px 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    
    <p class="product-name">Adults Plain Cotton T-shirt</p>
    <p class="product-price">Price: $7.99</p>
    <button class="add-to-cart-button">Add to cart</button>
    <button class="buy-now-button">Buy now</button>
</body>
</html>
